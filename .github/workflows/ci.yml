name: CI

on: [push, pull_request]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Flutter analyze (informational)
        # static analysis is informational; do not fail the build on findings
        continue-on-error: true
        run: flutter analyze
